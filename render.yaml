# Testing-only Render blueprint: free web service + free Postgres (30-day expiry).
# Dashboard: New + Blueprint → this repo. Frontend stays on game-experiment.

databases:
  - name: game-db
    plan: free
    databaseName: game_db
    user: game
    region: oregon

services:
  - type: web
    name: game-engine
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: game-db
          property: connectionString
      - key: HIKARI_MAX_POOL_SIZE
        value: "4"
      - key: HIKARI_MIN_IDLE
        value: "1"
      - key: JPA_SHOW_SQL
        value: "false"
      - key: OTLP_TRACING_EXPORT_ENABLED
        value: "false"
      - key: PASSKEY_RP_ID
        value: game-experiment-app.onrender.com
      - key: PASSKEY_ORIGIN
        value: https://game-experiment-app.onrender.com
      - key: JWT_SECRET_V1
        generateValue: true
